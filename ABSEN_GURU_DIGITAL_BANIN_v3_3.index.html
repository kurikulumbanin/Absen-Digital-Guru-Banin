const LS_TEACHERS = 'adg_teachers_v1';
const LS_ATTEND = 'adg_attendance_v1';
const LS_SEEDED = 'adg_seeded_v1';
const LS_HOLIDAYS = 'adg_holidays_v1';
const LS_WATERMARK = 'adg_watermark_v1';
const LS_GDRIVE_CLIENT_ID = 'adg_gdrive_client_id';
const LS_GDRIVE_FILE_ID = 'adg_gdrive_file_id';

let gdriveAccessToken = null;

let state = {
  teachers: [],
  attendance: {}, // key -> {status,time,catatan,paraf}
  holidays: [], // [{date:'YYYY-MM-DD', keterangan:'...'}] -- hari libur KBM dadakan/tambahan (di luar Jumat)
  view: 'dashboard',
  absensiDate: todayStr(),
  rekapFilter: { guru:'ALL', status:'ALL', dari:'', sampai:'' },
  dashboardRankingMonth: null, // 'YYYY-MM', diisi lazy ke bulan berjalan
};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function loadState(){
  const seeded = localStorage.getItem(LS_SEEDED);
  const t = localStorage.getItem(LS_TEACHERS);
  const a = localStorage.getItem(LS_ATTEND);
  const h = localStorage.getItem(LS_HOLIDAYS);
  if (!seeded || !t) {
    state.teachers = JSON.parse(JSON.stringify(SEED_TEACHERS));
    saveTeachers();
    localStorage.setItem(LS_SEEDED, '1');
  } else {
    try { state.teachers = JSON.parse(t); } catch(e){ state.teachers = JSON.parse(JSON.stringify(SEED_TEACHERS)); }
  }
  try { state.attendance = a ? JSON.parse(a) : {}; } catch(e){ state.attendance = {}; }
  try { state.holidays = h ? JSON.parse(h) : []; } catch(e){ state.holidays = []; }
}
function saveTeachers(){ localStorage.setItem(LS_TEACHERS, JSON.stringify(state.teachers)); }
function saveAttendance(){ localStorage.setItem(LS_ATTEND, JSON.stringify(state.attendance)); }
function saveHolidays(){ localStorage.setItem(LS_HOLIDAYS, JSON.stringify(state.holidays)); }

/* ------------------ HARI LIBUR KBM ------------------ */
// Hari Jumat = libur KBM tetap (mingguan). Selain itu, admin bisa menambahkan
// tanggal libur dadakan/tambahan (mis. libur nasional, kegiatan pesantren, dsb)
// melalui menu Pengaturan, sehingga guru tidak perlu diabsen pada tanggal tsb.
function holidayInfo(dateStr){
  const dayName = dayNameForDate(dateStr);
  if (dayName === 'JUMAT') {
    return { libur:true, tetap:true, alasan:'Hari Jumat (libur KBM tetap)' };
  }
  const h = state.holidays.find(x=>x.date===dateStr);
  if (h) {
    return { libur:true, tetap:false, alasan: h.keterangan && h.keterangan.trim() ? h.keterangan.trim() : 'Libur KBM' };
  }
  return { libur:false, tetap:false, alasan:'' };
}
function sortedHolidays(){
  return [...state.holidays].sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

function attKey(teacherId, jadwalIdx, dateStr){ return teacherId+'::'+jadwalIdx+'::'+dateStr; }

/* ------------------ UTILITIES ------------------ */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDateHuman(dateStr){
  if(!dateStr) return '-';
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dayName = capitalize(JS_DAY_TO_NAME[dt.getDay()]);
  const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m-1];
  return `${dayName}, ${d} ${bulan} ${y}`;
}
function nowTimeStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}
function capitalize(s){ return s.charAt(0)+s.slice(1).toLowerCase(); }
function dayNameForDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  return JS_DAY_TO_NAME[dt.getDay()];
}
function extractSessionStart(waktu){
  // "KBM 8 - 14.30-15.10" -> sortable "14.30" and kbm number
  const m = waktu.match(/KBM\s*(\d+)/i);
  const t = waktu.match(/(\d{2}\.\d{2})-(\d{2}\.\d{2})/);
  return { kbm: m ? parseInt(m[1]) : 999, start: t ? t[1] : '99.99', end: t? t[2] : '' };
}

function toast(msg, type='success'){
  const wrap = document.getElementById('toast-container');
  const colors = { success:'bg-emerald-700', error:'bg-rose-600', info:'bg-emerald-900' };
  const el = document.createElement('div');
  el.className = `${colors[type]||colors.success} text-sand text-sm font-medium px-4 py-3 rounded-xl shadow-lift flex items-center gap-2 view-fade max-w-xs`;
  el.innerHTML = `<span class="w-2 h-2 rounded-full bg-gold-400 shrink-0"></span><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s,transform .3s'; el.style.opacity='0'; el.style.transform='translateX(20px)'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* ------------------ DERIVED DATA HELPERS ------------------ */
function allSessionsFlat(){
  const out = [];
  state.teachers.forEach(t=>{
    t.jadwal.forEach((j, idx)=>{
      out.push({ teacherId:t.id, teacherName:t.nama, jadwalIdx:idx, ...j });
    });
  });
  return out;
}
function sessionsForDate(dateStr){
  const dayName = dayNameForDate(dateStr);
  return allSessionsFlat()
    .filter(s=>s.hari===dayName)
    .map(s=>{
      const key = attKey(s.teacherId, s.jadwalIdx, dateStr);
      const rec = state.attendance[key];
      return { ...s, date: dateStr, key, status: rec?.status || null, time: rec?.time || null, catatan: rec?.catatan || '', paraf: rec?.paraf || false };
    })
    .sort((a,b)=> extractSessionStart(a.waktu).kbm - extractSessionStart(b.waktu).kbm);
}
function teacherById(id){ return state.teachers.find(t=>t.id===id); }

function totalSesiPerMinggu(){
  return state.teachers.reduce((sum,t)=>sum + t.jadwal.length, 0);
}
function attendanceRecordsAll(){
  return Object.entries(state.attendance).map(([key, rec])=>{
    const [teacherId, jadwalIdx, date] = key.split('::');
    const t = teacherById(Number(teacherId));
    const j = t ? t.jadwal[Number(jadwalIdx)] : null;
    return { key, teacherId:Number(teacherId), teacherName: t?t.nama:'(dihapus)', jadwalIdx:Number(jadwalIdx), date, ...rec, ...(j||{}) };
  }).filter(r=>r.date);
}

function monthlyAttendanceRanking(yearMonth){
  // yearMonth format: 'YYYY-MM'
  const records = attendanceRecordsAll().filter(r => r.date && r.date.startsWith(yearMonth));
  const byTeacher = {};
  records.forEach(r=>{
    if(!byTeacher[r.teacherId]) byTeacher[r.teacherId] = { teacherId:r.teacherId, teacherName:r.teacherName, hadir:0, izin:0, sakit:0, alpha:0, total:0 };
    const row = byTeacher[r.teacherId];
    row.total++;
    if(r.status==='HADIR') row.hadir++;
    else if(r.status==='IZIN') row.izin++;
    else if(r.status==='SAKIT') row.sakit++;
    else if(r.status==='ALPHA') row.alpha++;
  });
  return Object.values(byTeacher)
    .map(row => ({ ...row, pct: row.total ? Math.round((row.hadir/row.total)*100) : 0 }))
    .sort((a,b) => b.pct - a.pct || b.hadir - a.hadir);
}
function monthNameId(yearMonth){
  const [y,m] = yearMonth.split('-').map(Number);
  const names = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return `${names[m-1]} ${y}`;
}

    <div class="flex items-start gap-3">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-700 to-emerald-900 text-sand font-display font-bold flex items-center justify-center shrink-0">${escapeHtml(initials)}</div>

        <h4 class="font-bold text-emerald-950 truncate">${escapeHtml(t.nama)}</h4>
        <p class="text-xs text-emerald-800/50">${jumlahJadwal} sesi/minggu terjadwal &middot; target ${t.totalSesi}</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button data-action="view-guru" data-id="${t.id}" class="flex-1 text-xs font-bold py-2 rounded-lg bg-emerald-900/5 text-emerald-800 hover:bg-emerald-900/10 transition">Lihat Jadwal</button>

        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>

/* ============================================================
   REKAP ABSENSI
   ============================================================ */
function renderRekap(){
  const f = state.rekapFilter;
  let records = attendanceRecordsAll();
  if (f.guru !== 'ALL') records = records.filter(r=>String(r.teacherId)===String(f.guru));
  if (f.status !== 'ALL') records = records.filter(r=>r.status===f.status);
  if (f.dari) records = records.filter(r=>r.date >= f.dari);
  if (f.sampai) records = records.filter(r=>r.date <= f.sampai);
  records.sort((a,b)=> b.date.localeCompare(a.date));

  const totalRecords = records.length;
  const hadirN = records.filter(r=>r.status==='HADIR').length;
  const pctHadir = totalRecords ? Math.round((hadirN/totalRecords)*100) : 0;

  return `
  <div class="space-y-5">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${statCard('Total Catatan', totalRecords, 'seluruh riwayat', 'M9 17v-6h4v6m-7 4h10a2 2 0 002-2V7.414a2 2 0 00-.586-1.414l-2.414-2.414A2 2 0 0013.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z', 'emerald')}
      ${statCard('Hadir', hadirN, `${pctHadir}% dari filter`, 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z', 'emerald')}
      ${statCard('Izin', records.filter(r=>r.status==='IZIN').length, 'dari filter', 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z', 'gold')}
      ${statCard('Sakit/Alpha', records.filter(r=>r.status==='SAKIT'||r.status==='ALPHA').length, 'dari filter', 'M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z', 'rose')}
    </div>

    <div class="bg-white rounded-2xl shadow-soft border border-emerald-900/5 p-4 sm:p-5 flex flex-wrap gap-3 items-end">
      <div>
        <label class="text-xs font-semibold text-emerald-800/60 block mb-1">Guru</label>
        <select id="rekapGuruFilter" class="rounded-lg border border-emerald-900/15 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600/30">
          <option value="ALL">Semua Guru</option>
          ${state.teachers.map(t=>`<option value="${t.id}" ${String(f.guru)===String(t.id)?'selected':''}>${escapeHtml(t.nama)}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-emerald-800/60 block mb-1">Status</label>
        <select id="rekapStatusFilter" class="rounded-lg border border-emerald-900/15 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600/30">
          <option value="ALL">Semua Status</option>
          ${Object.entries(STATUS_META).map(([k,m])=>`<option value="${k}" ${f.status===k?'selected':''}>${m.label}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="text-xs font-semibold text-emerald-800/60 block mb-1">Dari Tanggal</label>
        <input id="rekapDariFilter" type="date" value="${f.dari}" class="rounded-lg border border-emerald-900/15 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600/30" />
      </div>
      <div>
        <label class="text-xs font-semibold text-emerald-800/60 block mb-1">Sampai Tanggal</label>
        <input id="rekapSampaiFilter" type="date" value="${f.sampai}" class="rounded-lg border border-emerald-900/15 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600/30" />
      </div>
      <div class="flex-1"></div>
      <button data-action="share-whatsapp" class="inline-flex items-center gap-2 bg-[#25D366] hover:bg-[#20bd5a] text-white text-sm font-bold px-4 py-2.5 rounded-xl shadow-soft transition active:scale-95">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.04 2c-5.52 0-10 4.48-10 10 0 1.76.46 3.48 1.34 5L2 22l5.14-1.35a9.96 9.96 0 004.9 1.25h.01c5.52 0 10-4.48 10-10s-4.48-10-10.01-10zm5.86 14.3c-.25.7-1.45 1.34-2 1.42-.53.08-1.19.11-1.92-.12-.44-.14-1.01-.32-1.74-.63-3.06-1.32-5.06-4.4-5.21-4.6-.15-.2-1.25-1.66-1.25-3.17 0-1.5.79-2.25 1.07-2.56.28-.3.6-.38.8-.38.2 0 .4 0 .58.01.19.01.44-.07.68.53.25.6.85 2.08.92 2.23.07.15.12.33.02.53-.1.2-.15.32-.3.5-.15.17-.31.39-.44.52-.15.15-.3.31-.13.6.17.3.76 1.27 1.64 2.06 1.13 1.02 2.08 1.34 2.37 1.49.29.15.46.13.63-.07.17-.2.72-.85.92-1.14.2-.29.4-.24.66-.14.27.1 1.71.82 2 .97.29.15.48.22.55.34.07.13.07.72-.18 1.42z"/></svg>
        Bagikan WhatsApp
      </button>
      <button data-action="export-pdf" class="inline-flex items-center gap-2 bg-rose-600 hover:bg-rose-700 text-white text-sm font-bold px-4 py-2.5 rounded-xl shadow-soft transition active:scale-95">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

        Export Excel
      </button>
    </div>

    ${(() => {
      const holidaysInPeriod = getHolidaysInRange(f.dari, f.sampai);
      if (!holidaysInPeriod.length) return '';
      return `
      <div class="bg-gold-50 border border-gold-300/50 rounded-2xl shadow-soft p-4 sm:p-5">
        <h4 class="font-display font-bold text-emerald-950 text-sm mb-2 flex items-center gap-2">
          <span>🌙</span> Hari Libur KBM pada Periode Ini (${holidaysInPeriod.length} hari)
        </h4>
        <div class="flex flex-wrap gap-2">
          ${holidaysInPeriod.map(hd => `
            <span class="text-xs font-semibold px-3 py-1.5 rounded-full bg-white border border-gold-400/40 text-emerald-800">

        </div>
        <p class="text-xs text-emerald-800/50 mt-2">Guru tidak diwajibkan absen pada tanggal-tanggal ini. Info ini otomatis tersinkron ke Export Excel dan Bagikan WhatsApp.</p>
      </div>`;
    })()}

    <div class="bg-white rounded-2xl shadow-soft border border-emerald-900/5 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-emerald-900/[0.03] text-left text-xs font-bold text-emerald-800/60 uppercase tracking-wide">
              <th class="px-4 py-3">Tanggal</th>
              <th class="px-4 py-3">Guru</th>
              <th class="px-4 py-3">Kelas</th>
              <th class="px-4 py-3">Mapel</th>
              <th class="px-4 py-3">Waktu</th>
              <th class="px-4 py-3">Status</th>

              records.slice(0,300).map(r=>{
                const m = STATUS_META[r.status] || {label:'-',chip:'bg-gray-50 text-gray-500 border-gray-200'};
                return `<tr class="hover:bg-emerald-900/[0.02]">
                  <td class="px-4 py-3 whitespace-nowrap text-emerald-900 font-medium">${r.date}</td>
                  <td class="px-4 py-3 whitespace-nowrap font-semibold text-emerald-950">${escapeHtml(r.teacherName)}</td>
                  <td class="px-4 py-3 whitespace-nowrap text-emerald-800/70">${escapeHtml(r.kelas||'-')}</td>
                  <td class="px-4 py-3 whitespace-nowrap text-emerald-800/70">${escapeHtml(r.mapel||'-')}</td>
                  <td class="px-4 py-3 whitespace-nowrap text-emerald-800/50 text-xs">${escapeHtml(r.waktu||'-')}</td>
                  <td class="px-4 py-3 whitespace-nowrap"><span class="text-xs font-bold px-2.5 py-1 rounded-full border ${m.chip}">${m.label}</span></td>
                  <td class="px-4 py-3 text-emerald-800/60 max-w-[200px] truncate">${escapeHtml(r.catatan||'-')}</td>
                </tr>`;
              }).join('')}
          </tbody>
        </table>
      </div>
      ${records.length>300 ? `<div class="px-4 py-3 text-xs text-emerald-800/40 border-t border-emerald-900/5">Menampilkan 300 dari ${records.length} catatan. Gunakan filter untuk mempersempit hasil.</div>` : ''}
    </div>
  </div>`;
}

function closeSidebarMobile(){

  document.getElementById('sidebarOverlay').classList.add('hidden');

function bindViewEvents(){
  // Absensi date input
  const dateInput = document.getElementById('absensiDateInput');
  if(dateInput) dateInput.addEventListener('change', e=>{ state.absensiDate = e.target.value; render(); });

  // Dashboard ranking month picker
  const rankingMonthInput = document.getElementById('dashboardRankingMonthInput');
  if(rankingMonthInput) rankingMonthInput.addEventListener('change', e=>{
    if(!e.target.value) return;
    state.dashboardRankingMonth = e.target.value;
    render();
  });

  const searchInput = document.getElementById('absensiSearchInput');
  if(searchInput) searchInput.addEventListener('input', e=>{ state._absensiSearch = e.target.value; render(); preserveFocus('absensiSearchInput'); });

  const guruSearchInput = document.getElementById('guruSearchInput');
  if(guruSearchInput) guruSearchInput.addEventListener('input', e=>{ state._guruSearch = e.target.value; render(); preserveFocus('guruSearchInput'); });

  const rg = document.getElementById('rekapGuruFilter');
  if(rg) rg.addEventListener('change', e=>{ state.rekapFilter.guru = e.target.value; render(); });
  const rs = document.getElementById('rekapStatusFilter');
  if(rs) rs.addEventListener('change', e=>{ state.rekapFilter.status = e.target.value; render(); });
  const rd = document.getElementById('rekapDariFilter');
  if(rd) rd.addEventListener('change', e=>{ state.rekapFilter.dari = e.target.value; render(); });
  const rsm = document.getElementById('rekapSampaiFilter');
  if(rsm) rsm.addEventListener('change', e=>{ state.rekapFilter.sampai = e.target.value; render(); });

  const restoreInput = document.getElementById('restoreFileInput');
  if(restoreInput) restoreInput.addEventListener('change', handleRestoreFile);

  const gdriveClientIdForm = document.getElementById('gdriveClientIdForm');
  if(gdriveClientIdForm) gdriveClientIdForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    gdriveSaveClientId(fd.get('clientId'));
  });

  const addHolidayForm = document.getElementById('addHolidayForm');
  if(addHolidayForm) addHolidayForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const date = fd.get('date');
    const keterangan = (fd.get('keterangan')||'').trim();
    if(!date){ toast('Tanggal libur wajib diisi.', 'error'); return; }
    if(dayNameForDate(date) === 'JUMAT'){
      toast('Hari Jumat sudah otomatis menjadi libur KBM tetap.', 'error');
      return;
    }
    const existing = state.holidays.find(h=>h.date===date);
    if(existing){
      existing.keterangan = keterangan || existing.keterangan;
    } else {
      state.holidays.push({ date, keterangan });
    }
    saveHolidays();
    render();
    toast(`Hari libur ${fmtDateHuman(date)} berhasil ditambahkan.`);
  });

  const watermarkForm = document.getElementById('watermarkForm');
  if(watermarkForm) watermarkForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    WATERMARK_CONFIG.enabled = fd.get('enabled') === 'on';
    WATERMARK_CONFIG.color = fd.get('colorMode') === 'original' ? 'original' : 'grayscale';
    WATERMARK_CONFIG.opacity = parseFloat(fd.get('opacity')) || WATERMARK_DEFAULT.opacity;
    WATERMARK_CONFIG.scale = parseFloat(fd.get('scale')) || WATERMARK_DEFAULT.scale;
    saveWatermarkConfig();
    toast('Pengaturan watermark berhasil disimpan.');
  });

  document.querySelectorAll('.detail-panel').forEach(p=>{}); // noop placeholder
}

function preserveFocus(id){
  const el = document.getElementById(id);
  if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
}

/* Delegated click handler for data-action buttons */
document.addEventListener('click', e=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  switch(action){
    case 'go-absensi-today':
      state.absensiDate = todayStr();
      setView('absensi');
      break;
    case 'date-shift': {
      const dir = Number(btn.dataset.dir);
      const [y,m,d] = state.absensiDate.split('-').map(Number);
      const dt = new Date(y,m-1,d);
      dt.setDate(dt.getDate()+dir);
      state.absensiDate = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
      render();
      break;
    }
    case 'ranking-month-shift': {
      const dir = Number(btn.dataset.dir);
      const base = state.dashboardRankingMonth || todayStr().slice(0,7);
      const [y,m] = base.split('-').map(Number);
      const dt = new Date(y, m-1+dir, 1);
      const ym = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
      state.dashboardRankingMonth = ym > todayStr().slice(0,7) ? todayStr().slice(0,7) : ym;
      render();
      break;
    }
    case 'ranking-month-current':
      state.dashboardRankingMonth = null;
      render();
      break;
    case 'date-today':
      state.absensiDate = todayStr();
      render();
      break;
    case 'mark-all-hadir': {
      const sessions = sessionsForDate(state.absensiDate);
      sessions.forEach(s=>{
        state.attendance[s.key] = { status:'HADIR', time: new Date().toISOString(), catatan: state.attendance[s.key]?.catatan||'', paraf: state.attendance[s.key]?.paraf||false };
      });
      saveAttendance();
      render();
      toast('Semua sesi hari ini ditandai Hadir.');
      break;
    }
    case 'set-status': {
      const key = btn.dataset.key;
      const status = btn.dataset.status;
      const existing = state.attendance[key] || {};
      if(existing.status === status){
        delete state.attendance[key];
      } else {
        state.attendance[key] = { ...existing, status, time: new Date().toISOString() };
      }
      saveAttendance();
      render();
      break;
    }
    case 'toggle-detail': {
      const card = btn.closest('[data-session-key]');
      const panel = card.querySelector('.detail-panel');
      const chevron = btn.querySelector('.detail-chevron');
      panel.classList.toggle('hidden');
      chevron.style.transform = panel.classList.contains('hidden') ? '' : 'rotate(180deg)';
      break;
    }
    case 'toggle-paraf': break; // handled via change listener below
    case 'add-guru': openAddGuruModal(); break;
    case 'edit-guru': openEditGuruModal(Number(btn.dataset.id)); break;
    case 'view-guru': openViewGuruModal(Number(btn.dataset.id)); break;
    case 'delete-guru': {
      const id = Number(btn.dataset.id);
      const t = teacherById(id);
      if(!t) return;
      confirmAction(`Hapus guru "${t.nama}"? Semua jadwal terkait juga akan terhapus.`, ()=>{
        state.teachers = state.teachers.filter(x=>x.id!==id);
        saveTeachers();
        render();
        toast(`Guru "${t.nama}" telah dihapus.`);
      });
      break;
    }
    case 'add-jadwal': openAddJadwalModal(Number(btn.dataset.id)); break;
    case 'delete-jadwal': {
      const id = Number(btn.dataset.id);
      const idx = Number(btn.dataset.idx);
      const t = teacherById(id);
      if(!t) return;
      t.jadwal.splice(idx,1);
      saveTeachers();
      renderGuruDetailModal(t);
      toast('Sesi KBM dihapus.');
      break;
    }
    case 'close-modal': closeModal(); break;
    case 'export-excel': exportExcel(); break;
    case 'export-pdf': exportPdf(); break;
    case 'share-whatsapp': shareWhatsapp(); break;
    case 'delete-holiday': {
      const date = btn.dataset.date;
      const h = state.holidays.find(x=>x.date===date);
      confirmAction(`Hapus tanggal libur ${fmtDateHuman(date)}${h && h.keterangan ? ' ('+h.keterangan+')' : ''}? Guru akan kembali perlu diabsen pada tanggal ini.`, ()=>{
        state.holidays = state.holidays.filter(x=>x.date!==date);
        saveHolidays();
        render();
        toast('Hari libur telah dihapus.');
      });
      break;
    }
    case 'backup-data': backupData(); break;
    case 'gdrive-connect': gdriveConnect(); break;
    case 'gdrive-backup': gdriveBackup(); break;
    case 'gdrive-restore': gdriveRestore(); break;
    case 'clear-attendance':
      confirmAction('Hapus seluruh riwayat absensi? Data guru & jadwal tidak akan terhapus.', ()=>{
        state.attendance = {};
        saveAttendance();
        render();
        toast('Riwayat absensi telah dihapus.');
      });
      break;
    case 'reset-all':
      confirmAction('Reset seluruh data ke kondisi awal (data akan diambil ulang dari sumber default)? Tindakan ini tidak dapat dibatalkan.', ()=>{
        localStorage.removeItem(LS_TEACHERS);
        localStorage.removeItem(LS_ATTEND);
        localStorage.removeItem(LS_SEEDED);
        localStorage.removeItem(LS_HOLIDAYS);
        loadState();
        render();
        toast('Data berhasil direset ke kondisi awal.');
      });
      break;
  }
});

   ============================================================ */
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function getFilteredRekapRecords(){
  const f = state.rekapFilter;
  let records = attendanceRecordsAll();
  if (f.guru !== 'ALL') records = records.filter(r=>String(r.teacherId)===String(f.guru));
  if (f.status !== 'ALL') records = records.filter(r=>r.status===f.status);
  if (f.dari) records = records.filter(r=>r.date >= f.dari);
  if (f.sampai) records = records.filter(r=>r.date <= f.sampai);
  records.sort((a,b)=>a.date.localeCompare(b.date));
  return records;
}
function rekapFilterLabel(){
  const f = state.rekapFilter;
  const guru = f.guru==='ALL' ? 'Semua Guru' : (teacherById(Number(f.guru))?.nama || 'Semua Guru');
  const status = f.status==='ALL' ? 'Semua Status' : (STATUS_META[f.status]?.label || f.status);
  const periode = (f.dari||f.sampai) ? `${f.dari?fmtDateHuman(f.dari):'awal'} s/d ${f.sampai?fmtDateHuman(f.sampai):'sekarang'}` : 'Seluruh Periode';
  return { guru, status, periode };
}
function rekapSummaryCounts(records){
  return {
    total: records.length,
    hadir: records.filter(r=>r.status==='HADIR').length,
    izin: records.filter(r=>r.status==='IZIN').length,
    sakit: records.filter(r=>r.status==='SAKIT').length,
    alpha: records.filter(r=>r.status==='ALPHA').length,
  };
}

/* Cari hari-hari (per guru) yang punya jadwal mengajar tapi BELUM/TIDAK ada catatan
   absensi sama sekali (atau baru sebagian) pada periode yang dipilih di Rekap. */
function getUnrecordedDays(dariFilter, sampaiFilter, guruFilter){
  let dari = dariFilter, sampai = sampaiFilter;
  if (!dari && !sampai){
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    dari = `${y}-${String(m+1).padStart(2,'0')}-01`;
    sampai = `${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`;
  } else {
    dari = dari || sampai;
    sampai = sampai || dari;
  }
  const teachers = (guruFilter && guruFilter !== 'ALL')
    ? state.teachers.filter(t=>String(t.id)===String(guruFilter))
    : state.teachers;

  const out = [];
  const start = new Date(dari+'T00:00:00');
  const end = new Date(sampai+'T00:00:00');
  if (isNaN(start) || isNaN(end) || start > end) return out;

  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dayName = JS_DAY_TO_NAME[d.getDay()];
    // Lewati tanggal yang sudah ditetapkan sebagai hari libur KBM (tetap/Jumat maupun dadakan),
    // supaya tidak salah ditandai "belum terabsen" padahal memang tidak ada KBM.
    if (holidayInfo(dateStr).libur) continue;
    teachers.forEach(t=>{
      const sesiIdx = [];
      t.jadwal.forEach((j, idx)=>{ if (j.hari === dayName) sesiIdx.push(idx); });
      if (!sesiIdx.length) return;
      const recorded = sesiIdx.filter(idx => !!state.attendance[attKey(t.id, idx, dateStr)]).length;
      if (recorded < sesiIdx.length){
        out.push({ date: dateStr, hari: capitalize(dayName), teacherName: t.nama, scheduled: sesiIdx.length, recorded });
      }
    });
  }
  return out.sort((a,b)=> a.date.localeCompare(b.date) || a.teacherName.localeCompare(b.teacherName));
}

/* Ambil daftar tanggal libur KBM (tetap Jumat + dadakan/tambahan) yang jatuh pada
   periode filter Rekap, lengkap dengan keterangannya. Dipakai untuk menyinkronkan
   info libur ke Export Excel, Bagikan WhatsApp, dan tampilan layar Rekap Absensi.
   (Belum diterapkan ke Export PDF.) */
function getHolidaysInRange(dariFilter, sampaiFilter){
  let dari = dariFilter, sampai = sampaiFilter;
  if (!dari && !sampai){
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    dari = `${y}-${String(m+1).padStart(2,'0')}-01`;
    sampai = `${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`;
  } else {
    dari = dari || sampai;
    sampai = sampai || dari;
  }
  const out = [];
  const start = new Date(dari+'T00:00:00');
  const end = new Date(sampai+'T00:00:00');
  if (isNaN(start) || isNaN(end) || start > end) return out;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const hi = holidayInfo(dateStr);
    if (hi.libur){
      out.push({ date: dateStr, hari: capitalize(JS_DAY_TO_NAME[d.getDay()]), tetap: hi.tetap, alasan: hi.alasan });
    }
  }
  return out.sort((a,b)=> a.date.localeCompare(b.date));
}

function rekapPerTeacher(records){
  const map = new Map();
  records.forEach(r=>{
    if(!map.has(r.teacherId)) map.set(r.teacherId, { nama:r.teacherName, hadir:0, sakit:0, izin:0, alpha:0, jp:0 });
    const row = map.get(r.teacherId);
    row.jp++; // JP Mengajar = total sesi terjadwal pada periode ini (Hadir + Sakit + Izin + Alpha)
    if(r.status==='HADIR') row.hadir++;
    else if(r.status==='SAKIT') row.sakit++;
    else if(r.status==='IZIN') row.izin++;
    else if(r.status==='ALPHA') row.alpha++;
  });
  return Array.from(map.values()).sort((a,b)=>a.nama.localeCompare(b.nama));
}
/* ====== WATERMARK PDF (bisa diedit) ======
   color: null = hitam putih (grayscale). Isi hex, mis. '#1c7a57', untuk watermark berwarna.
   opacity: transparansi 0-1. scale: proporsi lebar halaman. */
const WATERMARK_DEFAULT = { enabled: true, color: 'grayscale', opacity: 0.08, scale: 0.55 };
function loadWatermarkConfig(){
  try{
    const raw = localStorage.getItem(LS_WATERMARK);
    if(raw){
      const cfg = Object.assign({}, WATERMARK_DEFAULT, JSON.parse(raw));
      cfg.color = cfg.color === 'original' ? 'original' : 'grayscale'; // migrasi nilai lama
      return cfg;
    }
  }catch(e){}
  return Object.assign({}, WATERMARK_DEFAULT);
}
const WATERMARK_CONFIG = loadWatermarkConfig();
function saveWatermarkConfig(){
  localStorage.setItem(LS_WATERMARK, JSON.stringify(WATERMARK_CONFIG));
  buildWatermarkImage();
}
let WATERMARK_DATA_URL = null;
function buildWatermarkImage(){
  try{
    const img = new Image();
    img.onload = function(){
      const size = 600;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      const imgData = ctx.getImageData(0, 0, size, size);
      const d = imgData.data;
      let mode = WATERMARK_CONFIG.color; // 'grayscale' | 'original'
      for (let i = 0; i < d.length; i += 4){
        if (mode === 'grayscale'){
          const gray = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          d[i] = gray; d[i+1] = gray; d[i+2] = gray;
        }
        // mode 'original' -> biarkan warna asli logo, tidak diubah
      }
      ctx.putImageData(imgData, 0, 0);
      WATERMARK_DATA_URL = canvas.toDataURL('image/png');
    };
    img.onerror = function(){ console.warn('Gagal membuat watermark'); };
    img.src = LOGO_BASE64;
  }catch(e){ console.warn('Gagal membuat watermark', e); }
}
buildWatermarkImage();

function exportPdf(){
  if (typeof window.jspdf === 'undefined'){ toast('Gagal memuat modul PDF. Periksa koneksi internet.', 'error'); return; }
  const { jsPDF } = window.jspdf;
  const records = getFilteredRekapRecords();
  const { guru, status, periode } = rekapFilterLabel();
  const c = rekapSummaryCounts(records);
  const pct = k => c.total ? Math.round((k/c.total)*1000)/10 : 0;
  const pHadir=pct(c.hadir), pSakit=pct(c.sakit), pIzin=pct(c.izin), pAlpha=pct(c.alpha);
  const perTeacher = rekapPerTeacher(records);

  const CREAM=[250,243,222], CREAM2=[245,235,205], GOLD_DK=[150,112,42], GOLD=[184,146,66], GOLD_LT=[214,182,120],
        INK=[54,38,20], MUTED=[110,90,60], EMERALD=[27,94,73],
        C_HADIR=[28,122,87], C_IZIN=[191,154,52], C_SAKIT=[14,116,144], C_ALPHA=[190,45,63];

  const doc = new jsPDF({ orientation:'portrait', unit:'pt', format:'a4' });
  const PW = doc.internal.pageSize.getWidth();
  const PH = doc.internal.pageSize.getHeight();
  const ML = 46, MR = 46, CW = PW - ML - MR;
  const CX = PW/2;

  function drawWatermark(){
    if (!WATERMARK_CONFIG.enabled || !WATERMARK_DATA_URL) return;
    try{
      const wSize = PW * WATERMARK_CONFIG.scale;
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({ opacity: WATERMARK_CONFIG.opacity }));
      doc.addImage(WATERMARK_DATA_URL, 'PNG', CX - wSize/2, PH/2 - wSize/2, wSize, wSize);
      doc.restoreGraphicsState();
    }catch(e){ console.warn('Gagal menampilkan watermark pada PDF', e); }
  }
  function drawFrame(){
    doc.setFillColor(...CREAM); doc.rect(0,0,PW,PH,'F');
    doc.setDrawColor(...GOLD_DK); doc.setLineWidth(1.3); doc.rect(18,18,PW-36,PH-36,'D');
    [[18,18],[PW-18,18],[18,PH-18],[PW-18,PH-18]].forEach(([x,y])=>{
      doc.setFillColor(...GOLD_DK);
      doc.triangle(x-6,y, x+6,y, x,y-6, 'F');
      doc.triangle(x-6,y, x+6,y, x,y+6, 'F');
    });
  }
  function drawFooter(pageNumber){
    doc.setDrawColor(...GOLD_LT); doc.setLineWidth(0.6); doc.line(ML, PH-34, PW-MR, PH-34);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...MUTED);
    doc.text('Absen Digital Guru Pesantren Huraidhah 1 (Kitab-Putra)', ML, PH-26);
    doc.text(`Halaman ${pageNumber}`, PW-MR, PH-26, {align:'right'});
  }

  drawFrame();
  drawWatermark();

  /* ---- logo ---- */
  const LOGO_R = 26;
  try { doc.addImage(LOGO_BASE64, 'PNG', CX-LOGO_R, 32, LOGO_R*2, LOGO_R*2); } catch(e) { console.warn('Gagal memuat logo pada PDF', e); }

  let y = 100;
  doc.setFont('helvetica','bold'); doc.setFontSize(21); doc.setTextColor(...INK);
  doc.text('REKAP ABSENSI GURU', CX, y, {align:'center'});
  y += 17;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...GOLD_DK);
  doc.text('Pesantren Huraidhah 1 (Kitab-Putra)', CX, y, {align:'center'});

  /* ---- stat rings: Hadir / Sakit / Izin / Alpha ---- */
  y += 40;
  const rings = [
    {label:'HADIR', value:c.hadir, pct:pHadir, color:C_HADIR},
    {label:'SAKIT', value:c.sakit, pct:pSakit, color:C_SAKIT},
    {label:'IZIN', value:c.izin, pct:pIzin, color:C_IZIN},
    {label:'ALPHA', value:c.alpha, pct:pAlpha, color:C_ALPHA},
  ];
  const RR = 24, gap = CW/4;
  rings.forEach((rg,i)=>{
    const x = ML + gap*i + gap/2;
    doc.setDrawColor(...rg.color); doc.setLineWidth(1.6); doc.circle(x, y, RR, 'D');
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...rg.color);
    doc.text(String(rg.value), x, y-2, {align:'center'});
    doc.setFont('helvetica','bold'); doc.setFontSize(6.5); doc.setTextColor(...rg.color);
    doc.text(rg.label, x, y+9, {align:'center'});
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(...INK);
    doc.text(`${rg.pct}%`, x, y+RR+18, {align:'center'});
  });

  y += RR + 40;
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...INK);
  doc.text('PERIODE REKAP :', ML, y);
  doc.setFont('helvetica','italic'); doc.setFontSize(9.5); doc.setTextColor(...INK);
  doc.text(periode, ML+92, y);
  y += 15;
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...INK);
  doc.text('TOTAL PERTEMUAN :', ML, y);
  doc.text(String(c.total), ML+108, y);

  y += 14;
  doc.setDrawColor(...GOLD_LT); doc.setLineWidth(0.8); doc.line(ML, y, PW-MR, y);

  y += 20;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...INK);
  doc.text('SUMMARY ABSENSI', ML, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
  doc.text(`Guru: ${guru}   |   Status: ${status}   |   Diunduh: ${fmtDateHuman(todayStr())} ${nowTimeStr()} WIB`, PW-MR, y, {align:'right'});

  /* ---- per-teacher summary table ---- */
  const CONT_TOP = 60;
  doc.autoTable({
    startY: y + 12,
    margin: { top: CONT_TOP, left: ML, right: MR, bottom: 44 },
    head: [['No.','Guru','JP Mengajar','Hadir','Sakit','Izin','Alpha']],
    body: perTeacher.map((t,i)=>[String(i+1), t.nama, String(t.jp), String(t.hadir), String(t.sakit), String(t.izin), String(t.alpha)]),
    styles: { font:'helvetica', fontSize:9, cellPadding:6, textColor:INK, lineColor:GOLD_LT, lineWidth:0.5, fillColor:CREAM },
    headStyles: { fillColor:GOLD, textColor:255, fontStyle:'bold', halign:'center' },
    alternateRowStyles: { fillColor:CREAM2 },
    columnStyles: {
      0:{halign:'center', cellWidth:34}, 1:{halign:'left'},
      2:{halign:'center', fontStyle:'bold'}, 3:{halign:'center'}, 4:{halign:'center'}, 5:{halign:'center'}, 6:{halign:'center', fontStyle:'bold'},
    },
    didParseCell: (data)=>{
      if (data.section==='body' && data.column.index===2){
        data.cell.styles.textColor = EMERALD;
      }
      if (data.section==='body' && data.column.index===6){
        const rgb = Number(data.cell.raw)>0 ? C_ALPHA : INK;
        data.cell.styles.textColor = rgb;
      }
    },
    didDrawPage: (data)=>{
      if (data.pageNumber > 1){
        drawFrame();
        doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(...INK);
        doc.text('SUMMARY ABSENSI', ML, 40);
      }
      drawWatermark();
      drawFooter(data.pageNumber);
    },
  });

  const finalY = doc.lastAutoTable.finalY + 22;
  doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(...MUTED);
  const catatanLines = doc.splitTextToSize('Catatan: Persentase dihitung dari total rekap pada periode terpilih. Kolom "JP Mengajar" = total jam pelajaran/sesi terjadwal pada periode ini (Hadir + Sakit + Izin + Alpha).', CW);
  doc.text(catatanLines, ML, finalY);

  const sigY = finalY + 96;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...INK);
  const sigX = PW/2, sigLineY = sigY+42;
  doc.text(`Kab. Bogor, ${fmtDateHuman(todayStr())}`, sigX, sigY-52, {align:'center'});
  doc.setFont('helvetica','bold');
  doc.text('Kabag Akademik', sigX, sigY-38, {align:'center'});
  doc.setDrawColor(...INK); doc.setLineWidth(0.7);
  doc.line(sigX-75, sigLineY, sigX+75, sigLineY);
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
  doc.text('MUHAMMAD JUFRI', sigX, sigLineY+13, {align:'center'});

  doc.save(`rekap_absensi_${todayStr()}.pdf`);
  toast('Rekap absensi berhasil diekspor ke PDF.');
}

/* ============================================================
   GOOGLE DRIVE BACKUP
   ============================================================ */
function gdriveGetClientId(){ return localStorage.getItem(LS_GDRIVE_CLIENT_ID) || ''; }

function gdriveLastBackupText(){
  const t = localStorage.getItem(LS_GDRIVE_LAST_BACKUP);
  if(!t) return 'Belum pernah backup ke Google Drive.';
  try{
    return `Backup terakhir ke Google Drive: ${new Date(t).toLocaleString('id-ID', { dateStyle:'medium', timeStyle:'short' })}`;
  }catch(e){ return 'Belum pernah backup ke Google Drive.'; }
}

function gdriveSaveClientId(id){
  localStorage.setItem(LS_GDRIVE_CLIENT_ID, (id||'').trim());
  gdriveTokenClient = null;
  gdriveAccessToken = null;
  toast('Client ID Google tersimpan.');
  render();
}

function gdriveEnsureTokenClient(){
  const clientId = gdriveGetClientId();
  if(!clientId){
    toast('Masukkan & simpan Client ID Google terlebih dahulu.', 'error');
    return null;
  }
  if(!window.google || !google.accounts || !google.accounts.oauth2){
    toast('Pustaka Google belum termuat. Pastikan koneksi internet aktif lalu muat ulang halaman.', 'error');
    return null;
  }
  if(!gdriveTokenClient || gdriveTokenClient._clientId !== clientId){
    gdriveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: ()=>{}
    });
    gdriveTokenClient._clientId = clientId;
  }
  return gdriveTokenClient;
}

function gdriveRequestToken(onReady){
  const tc = gdriveEnsureTokenClient();
  if(!tc) return;
  const now = Date.now();
  if(gdriveAccessToken && now < gdriveAccessTokenExpiry - 30000){
    onReady();
    return;
  }
  tc.callback = (resp) => {
    if(!resp || resp.error){
      toast('Gagal menghubungkan ke Google Drive. Periksa Client ID & pengaturan OAuth Anda.', 'error');
      return;
    }
    gdriveAccessToken = resp.access_token;
    gdriveAccessTokenExpiry = Date.now() + ((resp.expires_in||3600) * 1000);
    onReady();
  };
  tc.requestAccessToken({ prompt: '' });
}

function gdriveConnect(){
  gdriveRequestToken(()=>{ toast('Berhasil terhubung ke Google Drive.'); });
}

async function gdriveFindFileId(){
  const q = encodeURIComponent(`name='${GDRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`, {
    headers: { Authorization: `Bearer ${gdriveAccessToken}` }
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  return (data.files && data.files.length>0) ? data.files[0].id : null;
}

function gdriveBackup(){
  if(!gdriveGetClientId()){ toast('Masukkan & simpan Client ID Google terlebih dahulu.', 'error'); return; }
  gdriveRequestToken(async ()=>{
    try{
      toast('Mengunggah backup ke Google Drive...');
      const payload = { teachers: state.teachers, attendance: state.attendance, holidays: state.holidays, exportedAt: new Date().toISOString() };
      const content = JSON.stringify(payload, null, 2);
      let fileId = localStorage.getItem(LS_GDRIVE_FILE_ID);
      if(!fileId) fileId = await gdriveFindFileId();
      const metadata = { name: GDRIVE_FILE_NAME, mimeType: 'application/json' };
      const boundary = 'adgboundary_' + Date.now();
      const body =
        `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n` +
        `--${boundary}--`;
      const url = fileId
        ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
        : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
      const res = await fetch(url, {
        method: fileId ? 'PATCH' : 'POST',
        headers: { Authorization: `Bearer ${gdriveAccessToken}`, 'Content-Type': `multipart/related; boundary=${boundary}` },
        body
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      localStorage.setItem(LS_GDRIVE_FILE_ID, data.id);
      localStorage.setItem(LS_GDRIVE_LAST_BACKUP, new Date().toISOString());
      toast('Backup berhasil disimpan ke Google Drive.');
      render();
    }catch(err){
      toast('Gagal mengunggah backup ke Google Drive.', 'error');
    }
  });
}

function gdriveRestore(){
  if(!gdriveGetClientId()){ toast('Masukkan & simpan Client ID Google terlebih dahulu.', 'error'); return; }
  gdriveRequestToken(async ()=>{
    try{
      let fileId = localStorage.getItem(LS_GDRIVE_FILE_ID);
      if(!fileId) fileId = await gdriveFindFileId();
      if(!fileId){ toast('Belum ditemukan file backup di Google Drive.', 'error'); return; }
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { Authorization: `Bearer ${gdriveAccessToken}` }
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if(!Array.isArray(data.teachers)) throw new Error('Format tidak valid');
      confirmAction('Pulihkan data dari backup Google Drive? Data saat ini akan ditimpa.', ()=>{
        state.teachers = data.teachers;
        state.attendance = data.attendance || {};
        state.holidays = Array.isArray(data.holidays) ? data.holidays : [];
        saveTeachers(); saveAttendance(); saveHolidays();
        localStorage.setItem(LS_GDRIVE_FILE_ID, fileId);
        render();
        toast('Data berhasil dipulihkan dari Google Drive.');
      });
    }catch(err){
      toast('Gagal memulihkan data dari Google Drive.', 'error');
    }
  });
}
function handleRestoreFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try{
      const data = JSON.parse(evt.target.result);
      if(!Array.isArray(data.teachers)) throw new Error('Format tidak valid');
      confirmAction('Pulihkan data dari file backup ini? Data saat ini akan ditimpa.', ()=>{
        state.teachers = data.teachers;
        state.attendance = data.attendance || {};
        state.holidays = Array.isArray(data.holidays) ? data.holidays : [];
        saveTeachers(); saveAttendance(); saveHolidays();
        render();
        toast('Data berhasil dipulihkan dari backup.');
      });
    }catch(err){
      toast('Gagal memuat file backup. Pastikan format JSON valid.', 'error');
    }
  };
  reader.readAsText(file);
}
